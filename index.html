<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte Ejecutivo Campo - SOnamex</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .container { max-width: 600px; margin-top: 20px; }
        .header { background-color: #0d6efd; color: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header text-center">
        <h2>SOnamex: Reporte Ejecutivo</h2>
        <p>Captura de actividades de campo</p>
    </div>

    <form id="reportForm" class="bg-white p-4 shadow rounded">
        <!-- Datos Generales -->
        <div class="mb-3">
            <label class="form-label">Agente</label>
            <input type="text" class="form-control" id="agente" placeholder="Ej: Sergio Aguilar" required>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Zona/Canal</label>
                <select class="form-select" id="zona">
                    <option value="Zona 1">Zona 1</option>
                    <option value="Zona 2">Zona 2</option>
                    <option value="Zona 3">Zona 3 (Tijuana)</option>
                    <option value="Zona 4">Zona 4</option>
                </select>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Fecha</label>
                <input type="date" class="form-control" id="fecha" required>
            </div>
        </div>

        <!-- Actividades -->
        <hr>
        <h5>Actividad de Campo</h5>
        <div class="mb-3">
            <label class="form-label">Cliente Atendido</label>
            <input type="text" class="form-control" id="cliente" placeholder="Nombre del cliente">
        </div>
        <div class="mb-3">
            <label class="form-label">Resultado/Acuerdo</label>
            <textarea class="form-control" id="resultado" rows="3"></textarea>
        </div>

        <button type="submit" class="btn btn-primary w-100">Generar PDF Ejecutivo</button>
    </form>
</div>

<!-- Lógica simple de ejemplo para exportación -->
<script>
    document.getElementById('reportForm').addEventListener('submit', function(e) {
        e.preventDefault();
        alert("Generando formato ejecutivo PDF...");
        // Aquí conectarías con tu backend o API de generación de PDFs
    });
</script>

</body>
</html>
